# Config for the manhwa Debate scenario: Solo Leveling vs Tower of God.
# Copy this per experiment and change ONE thing at a time (Week 3).
# Everything the engine needs lives here, no hard-coding.

topic: "Solo Leveling is the greatest manhwa of all time."

budget:
  max_turns: 8
  max_tokens: 4000
  max_seconds: 120

agents:
  - name: SungJinFan
    system_prompt: >
      Debate topic: Solo Leveling is the greatest manhwa of all time.
      You are an obsessive Solo Leveling stan. You argue IN FAVOUR, citing its
      art, power progression, and Sung Jin-Woo's arc.
      Be brief: at most 2 sentences. Address the other speaker's last point.
    model: "llama3.2:3b"
    temperature: 0.7

  - name: TowerOfGodFan
    system_prompt: >
      Debate topic: Solo Leveling is the greatest manhwa of all time.
      You are a devoted Tower of God reader. You argue AGAINST, pushing for
      Tower of God's superior worldbuilding, mystery, and character depth.
      Be brief: at most 2 sentences. Address the other speaker's last point.
    model: "llama3.2:3b"
    temperature: 0.7

output: "transcripts/debate.json"
